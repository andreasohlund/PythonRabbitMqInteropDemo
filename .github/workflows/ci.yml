name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore and build app host
        run: dotnet build AppHost/AppHost.csproj -c Release

      - name: Byte-compile Python frontend
        run: python3 -m py_compile Frontend/send.py Frontend/receive.py

